name: MacroSage SHORT dashboard

# ---------------------------------------------------------------------------
# Triggers
#   * workflow_dispatch: lets you run it on demand from the Actions tab.
#   * schedule: target is 17:03 New York time, Monday-Friday -- 1 hour after
#     the 16:00 ET NYSE/S&P 500 close (2026-08-05: changed from the old fixed
#     22:17 UTC, which was ~17:17-18:17 ET depending on the season and drifted
#     an hour off "1hr post-close" for half the year). GitHub cron is ALWAYS
#     UTC and NEVER shifts for DST, so a single cron line can't track a fixed
#     US-Eastern clock time year-round -- two entries below cover the two
#     halves of the year instead:
#       - EDT (UTC-4, roughly mid-Mar to early-Nov): 17:03 ET = 21:03 UTC
#       - EST (UTC-5, roughly early-Nov to mid-Mar): 17:03 ET = 22:03 UTC
#     Split by whole months (EDT: Mar-Oct, EST: Nov-Feb) since cron can't
#     express the exact DST transition Sunday -- this leaves ~1 week around
#     the actual mid-March DST start where the EDT entry fires an hour EARLY
#     (16:03 ET instead of 17:03 ET), still safely after the 16:00 close, but
#     not the full 1hr-post-close target. The :03 offset (not :00) is
#     GitHub's own advice to dodge top-of-the-hour scheduling demand.
#     NOTE: GitHub does not guarantee scheduled workflows fire at the exact
#     configured minute -- runs in this repo have been observed firing up to
#     ~1hr after the configured time during busy periods, which is a platform
#     queuing behavior, not something this workflow can control. If delivery
#     keeps landing meaningfully later than 17:03 ET after this change, that's
#     the next thing to investigate (the HEALTHCHECK_URL heartbeat, once
#     activated, would surface a pattern here).
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      fmp_force_fail:
        description: "Force FMP to return empty so the free fallback tier is exercised (test only)."
        type: boolean
        default: false
  schedule:
    # PRIMARY - 17:03 ET, the intended 1hr-post-close slot.
    - cron: '3 21 * 3-10 1-5'      # EDT (Mar-Oct): 17:03 ET
    - cron: '3 22 * 11,12,1,2 1-5' # EST (Nov-Feb): 17:03 ET
    # BACKUP - same job one hour later. GitHub's scheduler is best-effort and
    # has silently dropped this workflow's trigger at least twice (Mon 8/3 and
    # Thu 8/6 2026): no error, no failed run, just nothing in the history. A
    # second independent trigger is the cheapest defence - both fires would
    # have to be dropped to lose a day.
    #
    # This is safe to run twice ONLY because two guards already exist:
    #   1. short_dashboard.py skips a re-send when the last successful send was
    #      within DEDUP_WINDOW_HOURS=4 (short_dashboard.py:2286), so the backup
    #      fire is a no-op email-wise when the primary already went out. The 1hr
    #      gap sits well inside that window.
    #   2. the `concurrency: short-dashboard` group below serialises runs, so
    #      the two can never race on the state.json commit.
    # The signal ledger is keyed by date and rewrites its row in place, so a
    # second run of the day updates rather than duplicates (verified against the
    # live ledger: 22 rows for 22 trading days, across days with 4 runs).
    - cron: '3 22 * 3-10 1-5'      # EDT (Mar-Oct): 18:03 ET
    - cron: '3 23 * 11,12,1,2 1-5' # EST (Nov-Feb): 18:03 ET

# Allow the run to push state.json (last-known-value cache + ledger) to the
# dedicated 'state' branch. main is never written by this workflow.
permissions:
  contents: write

# Never let two runs overlap (prevents racing on the state.json commit).
concurrency:
  group: short-dashboard
  cancel-in-progress: false

jobs:
  run-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify dependencies and compile
        run: |
          python -m pip install --upgrade pip
          if grep -qE '^[^#[:space:]]' requirements.txt; then
            echo "Installing pinned dependencies..."
            pip install -r requirements.txt
          else
            echo "No third-party dependencies (Python standard library only)."
          fi
          python -m py_compile short_dashboard.py
          echo "Syntax/compile check passed."

      - name: Restore state.json from the state branch
        continue-on-error: true
        run: |
          # Pull the persisted last-known-value cache + signal ledger from the
          # 'state' branch into the working tree before the run. Fail-safe: if the
          # branch or file is absent, fall back to the committed seed / fresh start.
          if git fetch origin "+refs/heads/state:refs/remotes/origin/state" --depth=1 2>/dev/null && git cat-file -e refs/remotes/origin/state:state.json 2>/dev/null; then
            git cat-file -p refs/remotes/origin/state:state.json > state.json
            echo "Restored state.json from the state branch."
          else
            echo "No state branch yet; using the committed seed or starting fresh."
          fi

      - name: Run dashboard
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          # TEST SEAM (workflow input only; not a secret): when true, short_dashboard.py
          # forces the FMP path empty so the free fallback tier can be verified. Empty on schedule.
          FMP_FORCE_FAIL: ${{ inputs.fmp_force_fail }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED: ${{ secrets.FRED }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: python short_dashboard.py

      - name: Persist state.json to the state branch
        if: always()
        continue-on-error: true
        run: |
          # State (last-known-value cache + signal ledger) persists on a dedicated
          # 'state' branch, NOT main, so main stays code-only and branch-protectable.
          # Git plumbing is used so the working tree / main are never touched.
          # Fail-safe: any error here never fails the run (the email is already sent).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/heads/state:refs/remotes/origin/state" --depth=1 2>/dev/null || true
          blob=$(git hash-object -w state.json)
          cur=$(git rev-parse --verify --quiet refs/remotes/origin/state:state.json || true)
          if [ "$blob" = "$cur" ]; then
            echo "state.json unchanged on the state branch; nothing to persist."
            exit 0
          fi
          tree=$(printf '100644 blob %s\tstate.json\n' "$blob" | git mktree)
          base=$(git rev-parse --verify --quiet refs/remotes/origin/state || true)
          if [ -n "$base" ]; then
            new=$(git commit-tree "$tree" -p "$base" -m "chore: update last-known market values [skip ci]")
          else
            new=$(git commit-tree "$tree" -m "chore: seed last-known market values [skip ci]")
          fi
          git push origin "$new:refs/heads/state"
          echo "state.json persisted to the state branch ($new)."

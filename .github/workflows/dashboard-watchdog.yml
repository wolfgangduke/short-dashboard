name: dashboard-watchdog

# ---------------------------------------------------------------------------
# Safety net for dashboard.yml's cron trigger.
#
# Incident 2026-08-03: dashboard.yml's schedule (cron '17 22 * * 1-5') ran
# clean every weekday the week before, then silently didn't fire on Monday
# 8/3 at all - no error, no failed run, just nothing in the Actions history
# for that day. The workflow config was fine (state: active, cron correct);
# this matches GitHub's known best-effort/occasionally-dropped scheduled
# trigger behavior, not a bug in this repo. This job catches that failure
# mode: it runs ~45min after the dashboard's expected window, checks whether
# a scheduled run actually succeeded today, and if not, re-triggers the
# dashboard and emails a heads-up.
#
# This is a GitHub-only stopgap. A more standard fix (dead-man's-switch via
# healthchecks.io, pinged from short_dashboard.py's existing heartbeat code)
# is documented in CLAUDE.md under "Reliability / heartbeat" but needs an
# external account + HEALTHCHECK_URL secret, so isn't active yet.
# ---------------------------------------------------------------------------
on:
  schedule:
    - cron: '00 23 * * 1-5'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: dashboard-watchdog
  cancel-in-progress: false

jobs:
  check-and-recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for a successful dashboard run today
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%Y-%m-%d)
          # Any successful run counts as healthy - schedule, workflow_dispatch (manual
          # recovery), or this watchdog's own re-trigger. What matters is whether
          # today's email actually went out, not which trigger sent it. (The script
          # itself is idempotent as of 2026-08-04 - short_dashboard.py's
          # email_sent_date guard - so even if the real cron later fires late on top
          # of a recovery run, it won't double-send.)
          found=$(gh run list --repo "${{ github.repository }}" --workflow dashboard.yml \
            --json conclusion,createdAt --limit 20 \
            --jq "[.[] | select(.conclusion==\"success\" and (.createdAt | startswith(\"$today\")))] | length")
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "Successful dashboard runs today ($today UTC): $found"

      - name: Re-trigger the dashboard (no successful run today)
        if: steps.check.outputs.found == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::dashboard.yml has no successful run today - re-triggering via workflow_dispatch."
          gh workflow run dashboard.yml --repo "${{ github.repository }}"

      - name: Checkout
        if: steps.check.outputs.found == '0'
        uses: actions/checkout@v7

      - name: Set up Python
        if: steps.check.outputs.found == '0'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Email a heads-up that a recovery run was needed
        if: steps.check.outputs.found == '0'
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python watchdog_alert.py
